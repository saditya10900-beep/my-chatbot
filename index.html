
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#212121">
<title>ADITYA AI PRO</title>
<style>
:root{
 --bg:#212121;--side:#171717;--panel:#2f2f2f;
 --hover:#383838;--text:#f4f4f4;--muted:#aaa;
 --border:#414141;--accent:#a78bfa;--user:#303030;
}
body.light{
 --bg:#fff;--side:#f5f5f5;--panel:#eee;
 --hover:#e3e3e3;--text:#222;--muted:#777;
 --border:#ddd;--accent:#7045d8;--user:#eee;
}
*{box-sizing:border-box}
body{
 margin:0;height:100dvh;overflow:hidden;background:var(--bg);
 color:var(--text);font-family:Arial, sans-serif
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
.app{display:flex;height:100dvh}
.sidebar{
 width:265px;background:var(--side);padding:15px;
 display:flex;flex-direction:column;flex-shrink:0;z-index:10
}
.logo{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:19px;margin:5px 0 25px}
.logo-icon{
 width:39px;height:39px;display:grid;place-items:center;
 border-radius:13px;background:linear-gradient(135deg,#a78bfa,#6d28d9);
 color:white;font-size:23px
}
.btn{
 background:transparent;border:1px solid var(--border);
 border-radius:10px;padding:11px;text-align:left;width:100%;margin-bottom:9px
}
.btn:hover,.history-item:hover{background:var(--hover)}
.label{font-size:11px;color:var(--muted);margin:22px 5px 10px}
.history{flex:1;overflow:auto}
.history-item{
 width:100%;padding:10px;border:0;background:transparent;
 border-radius:9px;text-align:left;display:flex;gap:6px;
 align-items:center;justify-content:space-between;font-size:13px
}
.history-item.active{background:var(--hover)}
.history-title{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.delete{border:0;background:none;color:var(--muted)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
 height:64px;border-bottom:1px solid var(--border);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 18px;gap:10px
}
.top-left,.top-right{display:flex;align-items:center;gap:10px}
.top-name{font-weight:bold;font-size:16px}
.icon{
 border:1px solid var(--border);background:var(--panel);
 border-radius:9px;padding:9px 11px
}
.model{
 background:var(--panel);color:var(--text);
 border:1px solid var(--border);border-radius:9px;
 padding:9px;max-width:190px
}
.chat-scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.chat-inner{max-width:850px;margin:auto;padding:30px 20px}
.welcome{
 min-height:54vh;display:flex;flex-direction:column;
 align-items:center;justify-content:center;text-align:center
}
.hero{
 width:75px;height:75px;border-radius:24px;display:grid;
 place-items:center;background:linear-gradient(135deg,#a78bfa,#6d28d9);
 color:white;font-size:38px;margin-bottom:20px
}
.welcome h1{font-size:36px;margin:0 0 12px}
.gradient{
 background:linear-gradient(90deg,#c4b5fd,#8b5cf6,#60a5fa);
 color:transparent;background-clip:text
}
.welcome p{color:var(--muted);max-width:450px;line-height:1.7}
.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;margin-top:25px}
.suggestion{
 background:var(--panel);border:1px solid var(--border);
 color:var(--text);border-radius:13px;padding:15px;text-align:left
}
.suggestion:hover{background:var(--hover)}
.suggestion b{display:block;margin-bottom:6px}
.suggestion small{color:var(--muted)}
.message{display:flex;gap:13px;margin:25px 0;align-items:flex-start}
.avatar{
 width:35px;height:35px;flex-shrink:0;border-radius:11px;
 background:var(--panel);display:grid;place-items:center
}
.message-body{flex:1;min-width:0}
.message-name{font-size:13px;font-weight:bold;margin:4px 0 9px}
.message-text{font-size:15px;line-height:1.8;overflow-wrap:anywhere;white-space:pre-wrap}
.message-text pre{background:#101010;color:#eee;padding:15px;border-radius:10px;overflow:auto}
.message-text code{background:var(--panel);padding:3px 5px;border-radius:4px}
.message-text pre code{background:none}
.actions{display:flex;gap:8px;margin-top:8px}
.action{background:none;border:0;color:var(--muted);font-size:12px;padding:5px}
.action:hover{color:var(--text)}
.typing{color:var(--muted);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.composer-area{padding:10px 16px 15px}
.composer{
 max-width:850px;margin:auto;background:var(--panel);
 border:1px solid var(--border);border-radius:19px;padding:12px
}
.composer:focus-within{border-color:var(--accent)}
#prompt{
 width:100%;display:block;resize:none;max-height:180px;
 min-height:42px;border:0;outline:0;background:transparent;
 color:var(--text);padding:8px;line-height:1.6
}
.composer-bottom{display:flex;justify-content:space-between;align-items:center}
.hint{font-size:11px;color:var(--muted)}
.send{
 width:40px;height:40px;border:0;border-radius:12px;
 background:var(--text);color:var(--bg);font-size:22px
}
.send:disabled{opacity:.4}
.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:9px}
.overlay{
 position:fixed;inset:0;background:#000a;z-index:30;
 display:none;align-items:center;justify-content:center;padding:15px
}
.overlay.show{display:flex}
.modal{
 width:100%;max-width:440px;background:var(--side);
 border:1px solid var(--border);border-radius:17px;padding:23px
}
.modal h2{margin:0 0 10px}
.modal p{font-size:13px;line-height:1.6;color:var(--muted)}
.field-label{display:block;font-size:13px;margin:16px 0 7px}
.field{
 width:100%;padding:12px;border:1px solid var(--border);
 border-radius:9px;background:var(--bg);color:var(--text)
}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.primary,.secondary{padding:11px 14px;border:0;border-radius:9px}
.primary{background:var(--accent);color:white}
.secondary{background:var(--panel)}
.toast{
 position:fixed;z-index:50;bottom:95px;left:50%;
 transform:translateX(-50%);padding:12px 17px;
 border-radius:10px;background:var(--panel);border:1px solid var(--border);
 display:none;font-size:13px;max-width:90%
}
.toast.show{display:block}
@media(max-width:700px){
 .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-105%);transition:.2s;box-shadow:10px 0 40px #0005}
 .sidebar.open{transform:translateX(0)}
 #menuBtn{display:block}
 .topbar{padding:0 10px}
 .chat-inner{padding:20px 13px}
 .composer-area{padding:8px 10px 12px}
 .suggestions{grid-template-columns:1fr}
 .welcome h1{font-size:29px}
 .model{max-width:140px}
}
#menuBtn{display:none}
@media(max-width:700px){#menuBtn{display:block}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="logo"><div class="logo-icon">✦</div> ADITYA AI PRO</div>
 <button class="btn" id="newChat">＋ New Chat</button>
 <div class="label">CHAT HISTORY</div>
 <div class="history" id="history"></div>
 <div style="margin-top:auto">
  <button class="btn" id="settingsBtn">⚙ API Settings</button>
  <button class="btn" id="themeBtn">☀ Change Theme</button>
  <button class="btn" id="clearBtn">♲ Clear Chats</button>
  <button class="btn" id="exportBtn">↓ Export Chat</button>
 </div>
</aside>

<main class="main">
<header class="topbar">
 <div class="top-left">
  <button class="icon" id="menuBtn">☰</button>
  <span class="top-name">ADITYA AI PRO ✦</span>
 </div>
 <div class="top-right">
  <select class="model" id="model">
   <optgroup label="GPT Models">
    <option value="openai/gpt-oss-20b">GPT OSS 20B</option>
    <option value="openai/gpt-oss-120b">GPT OSS 120B</option>
   </optgroup>
   <optgroup label="Llama Models">
    <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
    <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>
   </optgroup>
  </select>
  <button class="icon" id="settingsTop">⚙</button>
 </div>
</header>

<section class="chat-scroll" id="chatScroll">
 <div class="chat-inner" id="chatContent"></div>
</section>

<div class="composer-area">
 <div class="composer">
  <textarea id="prompt" rows="1" placeholder="Message ADITYA AI PRO..."></textarea>
  <div class="composer-bottom">
   <span class="hint">Enter to send · Shift + Enter for new line</span>
   <button class="send" id="sendBtn">↑</button>
  </div>
 </div>
 <div class="footer">AI can make mistakes. Check important information.</div>
</div>
</main>
</div>

<div class="overlay" id="settingsOverlay">
 <div class="modal">
  <h2>⚙ API Settings</h2>
  <p>Enter your Groq API key. It stays in browser memory only and is not saved in localStorage.</p>
  <label class="field-label">Groq API Key</label>
  <input class="field" id="apiKey" type="password" placeholder="gsk_..." autocomplete="off">
  <label class="field-label">Select AI Model</label>
  <select class="field" id="modalModel">
   <optgroup label="GPT">
    <option value="openai/gpt-oss-20b">GPT OSS 20B</option>
    <option value="openai/gpt-oss-120b">GPT OSS 120B</option>
   </optgroup>
   <optgroup label="Llama">
    <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
    <option value="llama-3.1-8b-instant">Llama 3.1 8B</option>
   </optgroup>
  </select>
  <p>Create your key at <a style="color:var(--accent)" href="https://console.groq.com/keys" target="_blank" rel="noopener">Groq Console ↗</a></p>
  <div class="modal-actions">
   <button class="secondary" id="cancel">Cancel</button>
   <button class="secondary" id="removeKey">Remove</button>
   <button class="primary" id="connect">Connect</button>
  </div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const API = "https://api.groq.com/openai/v1/chat/completions";
const STORE = "aditya_ai_pro_history_v2";

let apiKey = "";
let chats = [];
let current = null;
let busy = false;
let controller = null;
let generation = 0;

function uid(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}
function notify(message){
 const t=$("toast");
 t.textContent=message;
 t.classList.add("show");
 clearTimeout(notify.timer);
 notify.timer=setTimeout(()=>t.classList.remove("show"),3000);
}
function save(){
 try{localStorage.setItem(STORE,JSON.stringify(chats.slice(0,40)));}
 catch{notify("Storage full.")}
}
function load(){
 try{
  const d=JSON.parse(localStorage.getItem(STORE)||"[]");
  chats=Array.isArray(d)?d.filter(c=>c&&typeof c.id==="string"&&Array.isArray(c.messages)).slice(0,40):[];
 }catch{chats=[];}
}
function active(){return chats.find(c=>c.id===current);}
function closeSide(){$("sidebar").classList.remove("open");}

function createChat(){
 if(busy)return notify("Wait for the current answer.");
 current=uid();
 chats.unshift({id:current,title:"New Chat",messages:[],created:Date.now()});
 chats=chats.slice(0,40);
 save();render();closeSide();
 $("prompt").focus();
}
function selectChat(id){
 if(busy)return;
 current=id;render();closeSide();
}
function openSettings(){
 $("apiKey").value="";
 $("settingsOverlay").classList.add("show");
}
function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}
function format(s){
 let blocks=[];
 let html=escapeHTML(s);
 html=html.replace(/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g,(_,lang,code)=>{
  const n=blocks.length;
  blocks.push("<pre><code>"+code.trim()+"</code></pre>");
  return "%%BLOCK"+n+"%%";
 });
 html=html.replace(/`([^`\n]+)`/g,"<code>$1</code>");
 html=html.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
 html=html.replace(/\*(.+?)\*/g,"<em>$1</em>");
 html=html.replace(/\n/g,"<br>");
 html=html.replace(/%%BLOCK(\d+)%%/g,(_,n)=>"<br>"+blocks[+n]+"<br>");
 return html;
}
function add(role,content){
 const c=active();if(!c)return;
 c.messages.push({role,content});
 if(role==="user"&&c.title==="New Chat")c.title=content.slice(0,45);
 save();render();
}
function renderHistory(){
 const box=$("history");box.replaceChildren();
 chats.forEach(c=>{
  const row=document.createElement("div");
  row.className="history-item"+(c.id===current?" active":"");
  const title=document.createElement("span");
  title.className="history-title";
  title.textContent="▤ "+c.title;
  title.onclick=()=>selectChat(c.id);
  const del=document.createElement("button");
  del.className="delete";del.textContent="×";
  del.onclick=e=>{
   e.stopPropagation();
   if(busy)return;
   chats=chats.filter(x=>x.id!==c.id);
   if(current===c.id)current=chats[0]?.id||null;
   save();if(!current)createChat();else render();
  };
  row.append(title,del);box.append(row);
 });
}
function render(){
 renderHistory();
 const root=$("chatContent");root.replaceChildren();
 const messages=active()?.messages||[];
 if(!messages.length){
  const welcome=document.createElement("div");
  welcome.className="welcome";
  welcome.innerHTML=`
   <div class="hero">✦</div>
   <h1>Hello, <span class="gradient">Aditya!</span></h1>
   <p>Welcome to your personal AI assistant. Ask anything, learn something new or create something amazing.</p>
   <div class="suggestions">
    <button class="suggestion" data-q="Create a professional website using HTML CSS and JavaScript."><b>💻 Create a website</b><small>Build your own website</small></button>
    <button class="suggestion" data-q="Teach me artificial intelligence in simple Hindi."><b>🧠 Learn AI</b><small>Understand AI easily</small></button>
    <button class="suggestion" data-q="Give me a fun browser game code."><b>🎮 Build a game</b><small>Start game development</small></button>
    <button class="suggestion" data-q="Create a daily study timetable for me."><b>📚 Study plan</b><small>Organize your day</small></button>
   </div>`;
  root.append(welcome);
  root.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
   $("prompt").value=b.dataset.q;send();
  });
 }else{
  messages.forEach((m,i)=>{
   const article=document.createElement("article");
   article.className="message";
   const avatar=document.createElement("div");
   avatar.className="avatar";
   avatar.textContent=m.role==="user"?"👤":"✦";
   const body=document.createElement("div");
   body.className="message-body";
   const name=document.createElement("div");
   name.className="message-name";
   name.textContent=m.role==="user"?"You":"ADITYA AI PRO";
   const text=document.createElement("div");
   text.className="message-text";
   text.innerHTML=format(m.content);
   body.append(name,text);
   if(m.role==="assistant"){
    const actions=document.createElement("div");
    actions.className="actions";
    const copy=document.createElement("button");
    copy.className="action";copy.textContent="▢ Copy";
    copy.onclick=async()=>{
     try{await navigator.clipboard.writeText(m.content);notify("Copied!");}
     catch{notify("Clipboard unavailable.");}
    };
    actions.append(copy);
    if(i===messages.length-1){
     const regen=document.createElement("button");
     regen.className="action";regen.textContent="↻ Regenerate";
     regen.onclick=regenerate;actions.append(regen);
    }
    body.append(actions);
   }
   article.append(avatar,body);root.append(article);
  });
 }
 if(busy){
  const t=document.createElement("div");
  t.className="message";
  t.innerHTML='<div class="avatar">✦</div><div class="message-body"><div class="message-name">ADITYA AI PRO</div><div class="typing">Thinking...</div></div>';
  root.append(t);
 }
 $("sendBtn").disabled=busy;
 $("prompt").disabled=busy;
 requestAnimationFrame(()=>{$("chatScroll").scrollTop=$("chatScroll").scrollHeight;});
}
function resize(){
 const p=$("prompt");p.style.height="auto";
 p.style.height=Math.min(p.scrollHeight,180)+"px";
}

async function callGroq(messages,signal){
 const model=$("model").value;
 const response=await fetch(API,{
  method:"POST",signal,
  headers:{
   "Content-Type":"application/json",
   "Authorization":"Bearer "+apiKey
  },
  body:JSON.stringify({
   model,
   messages:[
    {role:"system",content:"You are ADITYA AI PRO, a helpful, friendly AI assistant. Respond in the user's language. Use simple Hindi or Hinglish when appropriate. Give clear and accurate answers."},
    ...messages.slice(-20)
   ],
   temperature:0.7,
   max_completion_tokens:4096,
   stream:false
  })
 });
 let data={};
 try{data=await response.json();}catch{}
 if(!response.ok){
  if(response.status===401||response.status===403)throw Error("Invalid API key or access denied.");
  if(response.status===429)throw Error("Rate limit or usage quota exceeded.");
  throw Error(data.error?.message||"API error "+response.status);
 }
 const answer=data.choices?.[0]?.message?.content;
 if(typeof answer!=="string"||!answer.trim())throw Error("Empty response from model.");
 return answer;
}
async function generate(){
 if(busy||!apiKey)return;
 const c=active();if(!c)return;
 const chatId=current;
 const token=++generation;
 const messages=c.messages.map(m=>({role:m.role,content:m.content}));
 busy=true;render();
 controller=new AbortController();
 try{
  const answer=await callGroq(messages,controller.signal);
  if(token!==generation||current!==chatId)return;
  add("assistant",answer);
 }catch(e){
  if(e.name!=="AbortError"&&token===generation&&current===chatId){
   add("assistant","Sorry, an error occurred:\n\n"+e.message);
  }
 }finally{
  if(token===generation){
   busy=false;controller=null;render();
  }
 }
}
function send(){
 if(busy)return;
 const value=$("prompt").value.trim();
 if(!value)return;
 if(!apiKey){openSettings();return notify("Enter your Groq API key first.");}
 if(!active())createChat();
 $("prompt").value="";resize();
 add("user",value);
 generate();
}
function regenerate(){
 if(busy)return;
 const c=active();if(!c||!c.messages.length)return;
 if(c.messages[c.messages.length-1].role==="assistant")c.messages.pop();
 if(!apiKey){openSettings();return;}
 save();generate();
}
function stop(){
 if(!busy)return;
 generation++;
 if(controller)controller.abort();
 busy=false;controller=null;render();
 notify("Generation stopped.");
}
function exportChat(){
 const c=active();if(!c)return;
 const content=c.messages.map(m=>
  (m.role==="user"?"YOU":"ADITYA AI PRO")+"\n"+m.content
 ).join("\n\n----------------\n\n");
 const blob=new Blob([content],{type:"text/plain"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="aditya-ai-chat.txt";a.click();
 URL.revokeObjectURL(url);
}

// Controls
$("newChat").onclick=createChat;
$("settingsBtn").onclick=openSettings;
$("settingsTop").onclick=openSettings;
$("menuBtn").onclick=()=>$("sidebar").classList.toggle("open");
$("sendBtn").onclick=send;
$("prompt").oninput=resize;
$("prompt").onkeydown=e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}
};
$("connect").onclick=()=>{
 const key=$("apiKey").value.trim();
 if(!key)return notify("Enter your API key.");
 if(/\s/.test(key))return notify("Invalid key format.");
 apiKey=key;
 $("model").value=$("modalModel").value;
 $("settingsOverlay").classList.remove("show");
 notify("API key connected for this session.");
};
$("modalModel").onchange=()=>{$("model").value=$("modalModel").value;};
$("model").onchange=()=>{$("modalModel").value=$("model").value;};
$("cancel").onclick=()=>$("settingsOverlay").classList.remove("show");
$("removeKey").onclick=()=>{
 apiKey="";
 $("apiKey").value="";
 $("settingsOverlay").classList.remove("show");
 notify("API key removed.");
};
$("settingsOverlay").onclick=e=>{
 if(e.target===$("settingsOverlay"))$("settingsOverlay").classList.remove("show");
};
$("themeBtn").onclick=()=>{
 document.body.classList.toggle("light");
 localStorage.setItem("aditya_theme",document.body.classList.contains("light")?"light":"dark");
};
$("clearBtn").onclick=()=>{
 if(busy)return notify("Stop generation first.");
 if(!confirm("Delete all chats?"))return;
 chats=[];current=null;save();createChat();
};
$("exportBtn").onclick=exportChat;
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){
  $("settingsOverlay").classList.remove("show");
  closeSide();
 }
});
load();
if(!chats.length){
 current=uid();
 chats.push({id:current,title:"New Chat",messages:[],created:Date.now()});
}else current=chats[0].id;
if(localStorage.getItem("aditya_theme")==="light")document.body.classList.add("light");
$("modalModel").value=$("model").value;
render();
})();
</script>
</body>
</html>
